name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hal
          POSTGRES_PASSWORD: hal
          POSTGRES_DB: hal_nemofinder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff

      - name: Lint
        run: ruff check src tests

      - name: Test
        env:
          HAL_DATABASE_URL: postgresql+asyncpg://hal:hal@localhost:5432/hal_nemofinder
          HAL_SYNC_DATABASE_URL: postgresql+psycopg2://hal:hal@localhost:5432/hal_nemofinder
          HAL_REDIS_URL: redis://localhost:6379/0
          HAL_CELERY_BROKER_URL: redis://localhost:6379/1
          HAL_CELERY_RESULT_BACKEND: redis://localhost:6379/2
        run: |
          pytest -q --cov=src --cov-report=xml --cov-report=term-missing --junitxml=junit.xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml

  # ---------------------------------------------------------------------------
  cli-smoke:
    name: cli smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: hal-nemofinder version
        run: hal-nemofinder version
      - name: hal-nemofinder list verifiers
        run: hal-nemofinder list verifiers

  # ---------------------------------------------------------------------------
  helm:
    name: helm lint & template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: helm dependency update
        run: helm dependency update helm/hal-nemofinder || true
      - name: helm lint
        run: helm lint helm/hal-nemofinder
      - name: helm template (defaults)
        run: helm template hal helm/hal-nemofinder > /tmp/rendered.yaml
      - name: helm template (prod)
        run: |
          helm template hal helm/hal-nemofinder \
            --set postgresql.enabled=false \
            --set redis.enabled=false \
            --set externalDatabase.host=db.example.com \
            --set externalDatabase.existingSecret=hal-db \
            --set audit.hmacKeySecret=hal-audit \
            --set networkPolicy.enabled=true \
            --set serviceMonitor.enabled=true \
            > /tmp/rendered-prod.yaml
      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: helm-rendered
          path: /tmp/rendered*.yaml

  # ---------------------------------------------------------------------------
  build:
    name: build & scan image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}

      - name: Build image (load into local docker)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"    # don't fail CI on findings; upload to code-scanning
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
