name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    name: build, sign, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (api)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build & push API image
        id: push-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Build & push worker image
        id: push-worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.worker
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}-worker:${{ steps.ver.outputs.version }},${{ env.IMAGE }}-worker:latest
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate image SBOM
        run: |
          mkdir -p sbom
          syft ${{ env.IMAGE }}:${{ steps.ver.outputs.version }} \
            -o cyclonedx-json=sbom/image-${{ steps.ver.outputs.version }}.cdx.json
          syft dir:. \
            -o cyclonedx-json=sbom/source-${{ steps.ver.outputs.version }}.cdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes ${{ env.IMAGE }}@${{ steps.push-api.outputs.digest }} || true
          cosign sign --yes ${{ env.IMAGE }}-worker@${{ steps.push-worker.outputs.digest }} || true

      - name: Attest SBOM
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign attest --yes \
            --predicate sbom/image-${{ steps.ver.outputs.version }}.cdx.json \
            --type cyclonedx \
            ${{ env.IMAGE }}@${{ steps.push-api.outputs.digest }} || true

      - name: Package Helm chart
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: helm package
        run: |
          helm dependency update helm/hal-nemofinder || true
          helm package helm/hal-nemofinder --version ${{ steps.ver.outputs.version }} --app-version ${{ steps.ver.outputs.version }} -d dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: hal-nemofinder ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            sbom/*
            dist/*.tgz
