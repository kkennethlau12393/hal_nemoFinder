name: sbom

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # for cosign keyless signing
  packages: read

jobs:
  sbom:
    name: Generate & attest SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            v=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
            echo "version=${v}-$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate CycloneDX SBOM (filesystem)
        run: |
          mkdir -p sbom
          syft dir:. \
            --output cyclonedx-json=sbom/sbom-${{ steps.ver.outputs.version }}.cdx.json \
            --source-name hal-nemofinder \
            --source-version ${{ steps.ver.outputs.version }}

      - name: Generate SPDX SBOM (filesystem)
        run: |
          syft dir:. \
            --output spdx-json=sbom/sbom-${{ steps.ver.outputs.version }}.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign SBOM with cosign (keyless)
        if: success()
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes \
            --output-signature sbom/sbom-${{ steps.ver.outputs.version }}.cdx.json.sig \
            --output-certificate sbom/sbom-${{ steps.ver.outputs.version }}.cdx.json.pem \
            sbom/sbom-${{ steps.ver.outputs.version }}.cdx.json || \
            echo "cosign signing skipped (OIDC not available)"

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ steps.ver.outputs.version }}
          path: sbom/
          retention-days: 90

      - name: Attach SBOM to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sbom/*
