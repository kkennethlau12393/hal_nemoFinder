# ---------------------------------------------------------------------------
# hal-nemoFinder — GitLab CI/CD pipeline
#
# Mirrors .github/workflows/ci.yml for customers running GitLab.
# Stages: test → build → scan → publish
# ---------------------------------------------------------------------------

stages:
  - test
  - build
  - scan
  - publish

variables:
  PYTHON_VERSION: "3.11"
  IMAGE: $CI_REGISTRY_IMAGE
  DOCKER_BUILDKIT: "1"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  HELM_VERSION: "v3.14.0"

default:
  interruptible: true

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip/

# ---------------------------------------------------------------------------
.python-template:
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]" ruff

# ---------------------------------------------------------------------------
lint:
  extends: .python-template
  stage: test
  script:
    - ruff check src tests
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

test:
  extends: .python-template
  stage: test
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
      variables:
        POSTGRES_USER: hal
        POSTGRES_PASSWORD: hal
        POSTGRES_DB: hal_nemofinder
    - name: redis:7-alpine
      alias: redis
  variables:
    HAL_DATABASE_URL: postgresql+asyncpg://hal:hal@postgres:5432/hal_nemofinder
    HAL_SYNC_DATABASE_URL: postgresql+psycopg2://hal:hal@postgres:5432/hal_nemofinder
    HAL_REDIS_URL: redis://redis:6379/0
    HAL_CELERY_BROKER_URL: redis://redis:6379/1
    HAL_CELERY_RESULT_BACKEND: redis://redis:6379/2
  script:
    - pytest -q --cov=src --cov-report=xml --cov-report=term-missing --junitxml=junit.xml
  coverage: '/^TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - junit.xml

helm-lint:
  stage: test
  image: alpine/helm:3.14.0
  script:
    - helm dependency update helm/hal-nemofinder || true
    - helm lint helm/hal-nemofinder
    - helm template hal helm/hal-nemofinder > rendered.yaml
  artifacts:
    paths: [rendered.yaml]

cli-smoke:
  extends: .python-template
  stage: test
  script:
    - pip install -e .
    - hal-nemofinder version
    - hal-nemofinder list verifiers

# ---------------------------------------------------------------------------
build-image:
  stage: build
  image: docker:26
  services:
    - docker:26-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - docker build -f Dockerfile.prod
        --build-arg APP_VERSION=${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}
        --build-arg VCS_REF=${CI_COMMIT_SHA}
        -t $IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker save $IMAGE:$CI_COMMIT_SHORT_SHA -o image.tar
  artifacts:
    paths: [image.tar]
    expire_in: 1 day

# ---------------------------------------------------------------------------
trivy-scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: [build-image]
  script:
    - trivy image --input image.tar --severity HIGH,CRITICAL --exit-code 0 --ignore-unfixed --format table
    - trivy image --input image.tar --severity HIGH,CRITICAL --exit-code 0 --ignore-unfixed --format json -o trivy-report.json
  artifacts:
    paths: [trivy-report.json]
    when: always

sbom:
  stage: scan
  image:
    name: anchore/syft:latest
    entrypoint: [""]
  script:
    - mkdir -p sbom
    - syft dir:. -o cyclonedx-json=sbom/sbom-${CI_COMMIT_SHORT_SHA}.cdx.json
  artifacts:
    paths: [sbom/]

# ---------------------------------------------------------------------------
publish-image:
  stage: publish
  image: docker:26
  services:
    - docker:26-dind
  needs: [build-image, trivy-scan]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - docker load -i image.tar
    - docker tag $IMAGE:$CI_COMMIT_SHORT_SHA $IMAGE:${CI_COMMIT_TAG:-latest}
    - docker push $IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE:${CI_COMMIT_TAG:-latest}
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v/

publish-helm:
  stage: publish
  image: alpine/helm:3.14.0
  script:
    - helm dependency update helm/hal-nemofinder || true
    - helm package helm/hal-nemofinder -d dist/
    - |
      if [ -n "$HELM_REPO_URL" ]; then
        helm push dist/*.tgz oci://$HELM_REPO_URL
      fi
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  artifacts:
    paths: [dist/]
