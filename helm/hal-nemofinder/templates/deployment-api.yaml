apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hal-nemofinder.fullname" . }}-api
  labels:
    {{- include "hal-nemofinder.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    {{- toYaml .Values.api.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "hal-nemofinder.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hal-nemofinder.api.selectorLabels" . | nindent 8 }}
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "hal-nemofinder.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      affinity:
        {{- if .Values.api.affinity }}
        {{- toYaml .Values.api.affinity | nindent 8 }}
        {{- else }}
        {{- include "hal-nemofinder.api.defaultAffinity" . | nindent 8 }}
        {{- end }}
      {{- with .Values.api.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "hal-nemofinder.apiImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.api.command }}
          command: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.args }}
          args: {{ toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "hal-nemofinder.databaseSecretName" . }}
                  key: {{ include "hal-nemofinder.databaseSecretKey" . }}
            {{- if .Values.redis.enabled }}
            - name: HAL_REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@{{ .Release.Name }}-redis-master:6379/0"
            - name: HAL_CELERY_BROKER_URL
              value: "redis://:$(REDIS_PASSWORD)@{{ .Release.Name }}-redis-master:6379/1"
            - name: HAL_CELERY_RESULT_BACKEND
              value: "redis://:$(REDIS_PASSWORD)@{{ .Release.Name }}-redis-master:6379/2"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-redis
                  key: redis-password
            {{- else if .Values.externalRedis.url }}
            - name: HAL_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalRedis.existingSecret }}
                  key: {{ .Values.externalRedis.existingSecretUrlKey }}
            {{- end }}
            {{- if .Values.audit.enabled }}
            - name: HAL_AUDIT_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-dev" (include "hal-nemofinder.fullname" .)) .Values.audit.hmacKeySecret }}
                  key: {{ .Values.audit.hmacKeySecretKey }}
            {{- end }}
            {{- if .Values.auth.oidc.existingSecret }}
            - name: HAL_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.oidc.existingSecret }}
                  key: OIDC_CLIENT_SECRET
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "hal-nemofinder.fullname" . }}-config
            {{- if .Values.envFromSecret }}
            - secretRef:
                name: {{ .Values.envFromSecret }}
            {{- end }}
            {{- if .Values.envFromConfigMap }}
            - configMapRef:
                name: {{ .Values.envFromConfigMap }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.api.startupProbe | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-tmp
              mountPath: /app/tmp
            - name: app-run
              mountPath: /app/run
            {{- if .Values.plugins.pvc }}
            - name: plugins
              mountPath: /plugins
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: app-tmp
          emptyDir: {}
        - name: app-run
          emptyDir: {}
        {{- if .Values.plugins.pvc }}
        - name: plugins
          persistentVolumeClaim:
            claimName: {{ .Values.plugins.pvc }}
        {{- end }}
