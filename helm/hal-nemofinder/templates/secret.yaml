{{- /*
Dev/test-only secret.  In production, supply HAL_* values via
`envFromSecret` / `externalDatabase.existingSecret` / `audit.hmacKeySecret`
managed by an external-secrets operator (Vault, AWS Secrets Manager, etc.).
*/ -}}
{{- if and (not .Values.envFromSecret) (not .Values.auth.oidc.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hal-nemofinder.fullname" . }}-dev
  labels:
    {{- include "hal-nemofinder.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  # DO NOT USE IN PRODUCTION — this is a placeholder so fresh installs
  # of the chart work for smoke tests.
  AUDIT_HMAC_KEY: {{ randAlphaNum 48 | quote }}
{{- end }}
