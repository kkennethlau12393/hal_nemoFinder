# Default values for hal-nemofinder.
# This is a YAML-formatted file.
# Override in production with `helm install -f values-prod.yaml`.

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/hal-nemofinder/hal-nemofinder
  tag: "0.1.0"
  pullPolicy: IfNotPresent
  # Optional separate worker image; when empty the api image is reused.
  workerRepository: ""
  workerTag: ""

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

# ---------------------------------------------------------------------------
# API deployment
# ---------------------------------------------------------------------------
api:
  replicaCount: 3
  command: []    # override the image ENTRYPOINT/CMD if needed
  args: []
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
    maxUnavailable: ""
  service:
    type: ClusterIP
    port: 8000
    annotations: {}
  podLabels: {}
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
  nodeSelector: {}
  tolerations: []
  affinity: {}      # if empty, anti-affinity is generated by the template
  topologySpreadConstraints: []
  priorityClassName: ""
  terminationGracePeriodSeconds: 60
  livenessProbe:
    httpGet:
      path: /api/v1/health/live
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /api/v1/health/ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  startupProbe:
    httpGet:
      path: /api/v1/health/live
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0

# ---------------------------------------------------------------------------
# Celery worker deployment
# ---------------------------------------------------------------------------
worker:
  replicaCount: 5
  queues: "analysis,verification"
  concurrency: 4
  command: []
  args: []
  resources:
    requests:
      cpu: 1000m
      memory: 1Gi
    limits:
      cpu: 4000m
      memory: 4Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 50
    targetCPUUtilizationPercentage: 75
    # When using Prometheus Adapter / KEDA, set a custom metric for queue depth.
    customMetric:
      enabled: false
      name: celery_queue_length
      targetAverageValue: "10"
  podLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  terminationGracePeriodSeconds: 120

# ---------------------------------------------------------------------------
# Database / cache
# ---------------------------------------------------------------------------
postgresql:
  # In production, disable the embedded chart and point at a managed
  # database via `externalDatabase.*`.
  enabled: true
  auth:
    username: hal
    password: ""      # use existingSecret in production
    database: hal_nemofinder
    existingSecret: ""
  primary:
    persistence:
      enabled: true
      size: 50Gi
  image:
    repository: pgvector/pgvector
    tag: pg16

externalDatabase:
  # Used when postgresql.enabled = false.
  host: ""
  port: 5432
  user: hal
  database: hal_nemofinder
  existingSecret: ""    # must contain key DATABASE_PASSWORD
  existingSecretPasswordKey: DATABASE_PASSWORD
  sslmode: require

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    existingSecret: ""

externalRedis:
  url: ""               # e.g. rediss://:pass@host:6380/0
  existingSecret: ""
  existingSecretUrlKey: REDIS_URL

# ---------------------------------------------------------------------------
# Application configuration
# ---------------------------------------------------------------------------
env: []
# - name: HAL_LOG_LEVEL
#   value: INFO

envFromSecret: ""        # name of a Secret with additional HAL_ env vars
envFromConfigMap: ""     # name of a ConfigMap with additional HAL_ env vars

config:
  logLevel: INFO
  logFormat: json
  environment: production
  cacheTtlSeconds: 3600
  verificationTimeoutSeconds: 30
  confidenceThreshold: 0.7
  enableEmbeddings: true
  rateLimit:
    enabled: true
    rpm: 120
    analyzePerMinute: 30

auth:
  required: true
  oidc:
    issuer: ""
    clientId: ""
    audience: ""
    existingSecret: ""   # keys: OIDC_CLIENT_SECRET

audit:
  enabled: true
  hmacKeySecret: ""      # name of the K8s secret containing AUDIT_HMAC_KEY
  hmacKeySecretKey: AUDIT_HMAC_KEY

plugins:
  enabled: false
  modules: []            # dotted Python module paths to import at startup
  files: []              # absolute file paths inside the container
  pvc: ""                # PVC that contains plugin files, mounted at /plugins

# ---------------------------------------------------------------------------
# Networking
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: nginx
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts: []
    # - host: hal.example.com
    #   paths:
    #     - path: /
    #       pathType: Prefix
  tls: []
    # - secretName: hal-tls
    #   hosts:
    #     - hal.example.com

networkPolicy:
  enabled: false
  # CIDR blocks allowed to reach the API (only used when ingress.enabled=false).
  allowedIngressCIDRs: []
  # Egress allowed to external HTTPS (needed for KB lookups).
  allowExternalHTTPS: true

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------
serviceMonitor:
  enabled: false
  namespace: ""
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  path: /metrics

prometheusRule:
  enabled: false
  namespace: ""
  labels: {}

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  capabilities:
    drop:
      - ALL

# ---------------------------------------------------------------------------
# Migration hook
# ---------------------------------------------------------------------------
migrations:
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 900
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
