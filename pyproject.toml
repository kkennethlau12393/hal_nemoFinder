[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hal-nemofinder"
version = "0.1.0"
description = "Open-source hallucination detection framework for AI-driven drug discovery"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "celery[redis]",
    "redis",
    "rdkit-pypi",
    "httpx",
    "pydantic-settings",
    "alembic",
    "sentence-transformers",
    "pgvector",
    "numpy<2",
    "psycopg2-binary",
    "pyyaml",
    "structlog",
    "prometheus-client",
    "typer[all]",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
]

[project.entry-points."hal_nemofinder.verifiers"]
# Customers add their verifiers here, e.g.:
# my_verifier = "mycompany.verifiers:MyVerifier"

[project.entry-points."hal_nemofinder.knowledge_clients"]
# Customers add KB clients here, e.g.:
# internal_db = "mycompany.kb:InternalDBClient"

[project.entry-points."hal_nemofinder.aggregators"]
# Customers add aggregators here, e.g.:
# weighted_bayes = "mycompany.aggregators:WeightedBayes"

[project.entry-points."hal_nemofinder.extractors"]
# Customers add claim extractors here, e.g.:
# domain_extractor = "mycompany.extractors:DomainExtractor"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
]

[project.scripts]
hal-nemofinder = "src.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 99
